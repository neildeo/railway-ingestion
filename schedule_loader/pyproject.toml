[project]
name = "railway-ingestion-schedule-loader"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "google-cloud-bigquery>=3.0",
  "google-cloud-bigquery-storage>=2.0",
  "google-cloud-storage>=3.0",
  "pyarrow>=20.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
  "integration: tests requiring live external services",
]
