name: Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  detect:
    name: Detect changed roots
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed deployables
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t changed_files < <(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA"
          )

          mapfile -t manifests < <(
            find . \
              -mindepth 2 \
              -maxdepth 2 \
              -name deploy.json \
              -print \
              | sort
          )

          matrix='[]'
          all_roots=false

          # Changes to CI itself should exercise every deployable root.
          for file in "${changed_files[@]}"; do
            if [[ "$file" == .github/workflows/* ]]; then
              all_roots=true
              break
            fi
          done

          for manifest in "${manifests[@]}"; do
            root="${manifest#./}"
            root="${root%/deploy.json}"

            # Fail early if a deployment manifest is malformed.
            jq -e '
              (.image_name | type == "string" and length > 0) and
              (.cloud_run_job | type == "string" and length > 0) and
              (.region | type == "string" and length > 0) and
              (
                .depends_on
                | type == "array"
                and all(.[]; type == "string" and length > 0)
              )
            ' "$manifest" > /dev/null

            image_name="$(jq -r '.image_name' "$manifest")"

            affected="$all_roots"

            # A change within the deployable itself affects that root.
            if [[ "$affected" != true ]]; then
              for file in "${changed_files[@]}"; do
                if [[ "$file" == "$root/"* ]]; then
                  affected=true
                  break
                fi
              done
            fi

            # Shared dependencies declared by deploy.json also affect it.
            if [[ "$affected" != true ]]; then
              mapfile -t dependencies < <(
                jq -r '.depends_on[]' "$manifest"
              )

              for dependency in "${dependencies[@]}"; do
                dependency="${dependency#./}"
                dependency="${dependency%/}"

                for file in "${changed_files[@]}"; do
                  if [[ "$file" == "$dependency" ||
                        "$file" == "$dependency/"* ]]; then
                    affected=true
                    break 2
                  fi
                done
              done
            fi

            if [[ "$affected" == true ]]; then
              matrix="$(
                jq -c \
                  --arg root "$root" \
                  --arg image_name "$image_name" \
                  '. + [{
                    root: $root,
                    image_name: $image_name
                  }]' \
                  <<< "$matrix"
              )"
            fi
          done

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          if [[ "$(jq 'length' <<< "$matrix")" -gt 0 ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Affected roots:"
          jq . <<< "$matrix"

  test-build:
    name: Test & build (${{ matrix.root }})
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}

    defaults:
      run:
        working-directory: ${{ matrix.root }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: Test
        run: pytest

      - name: Build container
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
        run: docker build -t "$IMAGE_NAME" .

  ci:
    name: CI
    needs:
      - detect
      - test-build

    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check results
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          TEST_BUILD_RESULT: ${{ needs.test-build.result }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "Root detection failed."
            exit 1
          fi

          case "$TEST_BUILD_RESULT" in
            success)
              echo "All affected deployables passed."
              ;;
            skipped)
              echo "No deployable roots were affected."
              ;;
            *)
              echo "One or more deployables failed: $TEST_BUILD_RESULT"
              exit 1
              ;;
          esac